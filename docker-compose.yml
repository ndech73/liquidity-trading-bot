services:
  postgres:
    image: postgres:18-alpine
    container_name: liquidity-postgres
    environment:
      POSTGRES_DB: liquidity_bot
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
